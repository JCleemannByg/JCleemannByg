name: Deploy to GitHub Pages

# Not active until this folder is a GitHub repository with Pages enabled
# (Settings → Pages → Build and deployment → Source: GitHub Actions).

on:
  push:
    branches: [main]
  # Commits made by the built-in GITHUB_TOKEN do not trigger `push` workflows,
  # so the Instagram refresh workflow tells deploy to rebuild when it finishes.
  workflow_run:
    workflows: ["Refresh Instagram posts"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi environment (Hugo, Python, Pillow from pixi.lock)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true

      - name: Cache Hugo image/resources cache
        uses: actions/cache@v4
        with:
          path: resources
          key: hugo-resources-${{ hashFiles('content/**', 'assets/images/**') }}
          restore-keys: hugo-resources-

      - name: Build
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: pixi run build

      - name: Verify (languages, links, image dimensions, base path)
        env:
          VERIFY_BASE: /${{ github.event.repository.name }}/
        run: pixi run verify

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
