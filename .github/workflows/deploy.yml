name: Deploy to GitHub Pages

# Builds the site and publishes it. Deliberately needs NO write permission:
# the Instagram snapshot and image optimisation happen at build time in the
# runner, not as bot commits. That means this workflow works even when the
# repository's "Workflow permissions" setting is locked to read-only.
#
# Triggers:
#   * every push to main (content changes, Pages CMS edits)
#   * daily schedule, so the Instagram section refreshes by itself
#   * manual runs from the Actions tab

on:
  push:
    branches: [main]
  schedule:
    # Daily at 04:17 UTC (05:17/06:17 Danish time depending on DST).
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source (main)
        uses: actions/checkout@v4

      - name: Checkout develop for the preview build
        id: preview_src
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: develop
          path: preview-src

      - name: Setup pixi environment (Hugo, Python, Pillow from pixi.lock)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true

      - name: Refresh Instagram snapshot (best effort, build only)
        # Reads the public profile embed; if Instagram is unreachable or changes
        # its markup, the committed snapshot is used and the build continues.
        continue-on-error: true
        run: pixi run instagram

      - name: Downscale oversized uploads (build only)
        continue-on-error: true
        run: pixi run images

      - name: Cache Hugo image/resources cache
        uses: actions/cache@v4
        with:
          path: resources
          key: hugo-resources-${{ hashFiles('content/**', 'assets/images/**') }}
          restore-keys: hugo-resources-

      - name: Build
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          BASE_URL="https://$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]').github.io/${REPO_NAME}/"
          echo "Building for ${BASE_URL}"
          BASE_URL="$BASE_URL" pixi run build

      - name: Verify production (language, links, image dimensions, base path)
        env:
          VERIFY_BASE: /${{ github.event.repository.name }}/
        run: pixi run verify

      - name: Build preview from develop
        if: steps.preview_src.outcome == 'success'
        continue-on-error: true
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          HOST="https://$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]').github.io/${REPO_NAME}"
          echo "Preview at ${HOST}/preview/"
          pixi run hugo --environment preview \
            --source preview-src \
            --minify --cleanDestinationDir \
            --baseURL "${HOST}/preview/" \
            --destination "${PWD}/public/preview"

      - name: Verify preview (best effort)
        if: steps.preview_src.outcome == 'success'
        continue-on-error: true
        env:
          VERIFY_BASE: /${{ github.event.repository.name }}/preview/
        run: pixi run python3 scripts/verify.py --public public/preview

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
