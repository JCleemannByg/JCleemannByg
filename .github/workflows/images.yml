name: Optimize images

# Phone photos uploaded through Pages CMS can be several thousand pixels wide.
# This workflow downscales and recompresses anything oversized, then commits it
# back. Keeps the repo small and the Pages build fast.
#
# A commit made with the built-in GITHUB_TOKEN does not trigger other workflows,
# so deploy.yml also listens for this workflow finishing (workflow_run).

on:
  push:
    paths:
      - "assets/images/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-optimize
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true

      - name: Downscale oversized images
        run: pixi run images

      - name: Commit optimised images
        run: |
          git config user.name "image-optimizer[bot]"
          git config user.email "image-optimizer@users.noreply.github.com"
          git add assets/images
          if git diff --cached --quiet; then
            echo "No changes — all images within limits."
            exit 0
          fi
          git commit -m "chore(images): downscale uploaded photos"
          git push
