name: Refresh Instagram posts

# Keeps data/instagram_posts.json and the preview images in sync with the newest
# posts on the public profile embed. The site itself never calls Instagram: this
# workflow only commits a fresh snapshot, which the deploy workflow then builds.
#
# One-off setup in the repository:
#   Settings → Actions → General → Workflow permissions → "Read and write permissions"
# (needed so the job can commit the refreshed snapshot).
#
# A push made with the built-in GITHUB_TOKEN does not trigger other workflows, which
# is why deploy.yml also listens for this workflow finishing (workflow_run).

on:
  schedule:
    # Daily at 03:17 UTC (04:17/05:17 Danish time depending on DST).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi environment (Python + Pillow from pixi.lock)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true

      - name: Fetch latest posts
        # Best effort: if Instagram is unavailable or changes its embed page, the
        # previous snapshot stays in place and the site keeps building.
        run: pixi run instagram
        continue-on-error: true

      - name: Commit refreshed snapshot
        run: |
          git config user.name "instagram-refresh[bot]"
          git config user.email "instagram-refresh@users.noreply.github.com"
          git add data/instagram_posts.json assets/images/instagram/posts
          if git diff --cached --quiet; then
            echo "No changes — snapshot already current."
            exit 0
          fi
          git commit -m "chore(instagram): refresh latest posts"
          git push
