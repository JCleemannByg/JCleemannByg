name: Refresh preview (develop)

# A Pages deployment triggered from a non-default branch is treated by GitHub as a
# separate preview deployment and does NOT update the production site (including
# /preview/). So instead of deploying from develop, this workflow asks the normal
# deploy workflow to run on main — which rebuilds production AND the develop
# preview into the same production artifact.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  request-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run deploy.yml --ref main -R "${{ github.repository }}"
          echo "Deploy (with develop preview) requested on main."
