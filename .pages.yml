# Pages CMS-konfiguration — redigeringsfladen for J Cleemann Byg.
#
# Se docs/pages-cms.md for opsætning. Kort fortalt:
#   1. Repoet pushes til GitHub (offentligt, eller med Pages-adgang).
#   2. Gå til app.pagescms.org, log ind med GitHub, installer app'en på repoet.
#   3. Vælg repoet — denne fil bestemmer menuen og felterne.
#
# Billeder uploades til assets/images/ og refereres som /images/... i indholdet.
# Instagram-listerne (data/instagram_posts.json og data/instagram.yaml) styres
# automatisk af workflowen og er derfor bevidst ikke redigerbare her.
#
# Siden er lige nu KUN på dansk. Vil man have engelsk tilbage, oprettes
# content/en/ + i18n/en.toml, sproget tilføjes i hugo.toml, og der laves en
# "Engelsk indhold"-gruppe mere her i filen (se docs/pages-cms.md).
#
# Ikke redigerbart med vilje: layout/skabeloner, CSS-struktur, menupunkter
# (de ligger i hugo.toml) og GitHub-workflows.

media:
  input: assets/images
  output: /images

content:
  - name: design
    label: "Design"
    type: file
    path: data/design.yaml
    fields:
      - name: palette
        label: "Farver"
        type: object
        fields:
          - name: paper
            label: "Baggrund"
            type: string
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Hex-farve, fx #a9703f"
          - name: paper2
            label: "Sekundær baggrund"
            type: string
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Hex-farve, fx #a9703f"
          - name: card
            label: "Kort/paneler"
            type: string
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Hex-farve, fx #a9703f"
          - name: ink
            label: "Tekst og overskrifter"
            type: string
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Hex-farve, fx #a9703f"
          - name: inkSoft
            label: "Brødtekst"
            type: string
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Hex-farve, fx #a9703f"
          - name: muted
            label: "Dæmpet tekst"
            type: string
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Hex-farve, fx #a9703f"
          - name: oak
            label: "Accent"
            type: string
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Hex-farve, fx #a9703f"
          - name: oakDark
            label: "Accent, hover"
            type: string
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Hex-farve, fx #a9703f"
          - name: line
            label: "Streger"
            type: string
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Hex-farve, fx #a9703f"
      - name: typography
        label: "Typografi"
        type: object
        fields:
          - name: serif
            label: "Overskrifter (serif)"
            type: string
          - name: sans
            label: "Brødtekst (sans)"
            type: string
      - name: layout
        label: "Mål og effekter"
        type: object
        fields:
          - name: shell
            label: "Maks. indholdsbredde"
            type: string
          - name: gutter
            label: "Luft til siderne"
            type: string
          - name: radius
            label: "Hjørneradius på knapper"
            type: string
          - name: shadow
            label: "Skygge på kort og fotos"
            type: string
  - name: site
    label: "Kontaktoplysninger"
    type: file
    path: data/site.yaml
    fields:
      - name: brand
        label: "Navn (brand)"
        type: string
      - name: company
        label: "Firmanavn"
        type: string
      - name: street
        label: "Adresse"
        type: string
      - name: postal
        label: "Postnummer og by"
        type: string
      - name: phone
        label: "Telefon (vist)"
        type: string
      - name: phone_href
        label: "Telefon til opkald (fx +4542581101)"
        type: string
      - name: email
        label: "E-mail"
        type: string
      - name: cvr
        label: "CVR-linje i footer"
        type: string
      - name: founded
        label: "Stiftelsesdato (ÅÅÅÅ-MM-DD)"
        type: string
      - name: instagram
        label: "Instagram-brugernavn (uden @)"
        type: string
      - name: maps_url
        label: "Google Maps-link"
        type: string
      - name: og_image
        label: "Standard delebillede"
        type: image
      - name: description
        label: "Standard-beskrivelse (SEO)"
        type: text
  - name: tekster_da
    label: "Knap- og menutekster (dansk)"
    type: file
    path: i18n/da.toml
    format: toml
    fields:
      - name: skip
        label: "skip"
        type: string
      - name: nav_label
        label: "nav_label"
        type: string
      - name: language
        label: "language"
        type: string
      - name: brand_sub
        label: "brand_sub"
        type: string
      - name: call
        label: "call"
        type: string
      - name: write
        label: "write"
        type: string
      - name: instagram_open_post
        label: "instagram_open_post"
        type: string
      - name: instagram_view_post
        label: "instagram_view_post"
        type: string
      - name: instagram_open
        label: "instagram_open"
        type: string
      - name: instagram_embed_label
        label: "instagram_embed_label"
        type: string
      - name: close
        label: "close"
        type: string
      - name: follow
        label: "follow"
        type: string
      - name: see_projects
        label: "see_projects"
        type: string
      - name: read_more
        label: "read_more"
        type: string
      - name: all_projects
        label: "all_projects"
        type: string
      - name: featured
        label: "featured"
        type: string
      - name: services
        label: "services"
        type: string
      - name: about
        label: "about"
        type: string
      - name: instagram_label
        label: "instagram_label"
        type: string
      - name: instagram_heading
        label: "instagram_heading"
        type: string
      - name: instagram_text
        label: "instagram_text"
        type: string
      - name: contact_heading
        label: "contact_heading"
        type: string
      - name: address
        label: "address"
        type: string
      - name: phone
        label: "phone"
        type: string
      - name: email
        label: "email"
        type: string
      - name: open_map
        label: "open_map"
        type: string
      - name: see_project
        label: "see_project"
        type: string
      - name: project
        label: "project"
        type: string
      - name: category
        label: "category"
        type: string
      - name: year
        label: "year"
        type: string
      - name: back_to_projects
        label: "back_to_projects"
        type: string
      - name: before
        label: "before"
        type: string
      - name: after
        label: "after"
        type: string
      - name: footer_nav
        label: "footer_nav"
        type: string
      - name: footer_contact
        label: "footer_contact"
        type: string
      - name: rights
        label: "rights"
        type: string
      - name: built_by
        label: "built_by"
        type: string
  - name: dansk
    label: "Indhold"
    type: group
    items:
      - name: forside_da
        label: "Forside"
        type: file
        path: content/da/_index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: "Intern titel"
            type: string
            required: true
          - name: titel
            label: "Browser-titel (SEO)"
            type: string
          - name: beskrivelse
            label: "Meta-beskrivelse (SEO)"
            type: text
          - name: hero_billede
            label: "Hero-billede (bredt, ca. 16:9)"
            type: image
          - name: hero_eyebrow
            label: "Hero: lille tekst over overskriften"
            type: string
          - name: hero_overskrift
            label: "Hero: overskrift"
            type: string
          - name: hero_tekst
            label: "Hero: tekst"
            type: text
          - name: om_billede
            label: "Om-blok: billede (portræt, ca. 4:5)"
            type: image
          - name: om_overskrift
            label: "Om-blok: overskrift"
            type: string
          - name: om_tekst
            label: "Om-blok: tekst"
            type: text
          - name: fakta
            label: "Fakta-kolonnen"
            type: object
            list: true
            fields:
              - name: navn
                label: "Overskrift"
                type: string
              - name: tekst
                label: "Tekst"
                type: text
          - name: body
            label: "Brødtekst"
            type: rich-text
      - name: projekter_oversigt_da
        label: "Projekter (oversigtstekst)"
        type: file
        path: content/da/projekter/_index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: "Intern titel"
            type: string
            required: true
          - name: titel
            label: "Browser-titel (SEO)"
            type: string
          - name: beskrivelse
            label: "Meta-beskrivelse (SEO)"
            type: text
          - name: body
            label: "Brødtekst"
            type: rich-text
      - name: projekter_da
        label: "Projekter"
        type: collection
        path: content/da/projekter
        format: yaml-frontmatter
        filename: "{primary}.md"
        exclude: ["_index.md"]
        view:
          primary: title
          sort: weight
          order: asc
        fields:
          - name: title
            label: "Intern titel"
            type: string
            required: true
          - name: titel
            label: "Browser-titel (SEO)"
            type: string
          - name: beskrivelse
            label: "Meta-beskrivelse (SEO)"
            type: text
          - name: kategori
            label: "Kategori (fx Indbygning, Møbler, Udvendigt)"
            type: string
            required: true
          - name: aar
            label: "År"
            type: number
            required: true
            options:
              min: 2000
              max: 2100
          - name: weight
            label: "Rækkefølge (lav = først)"
            description: "Lavere tal vises først. Brug fx 10, 20, 30."
            type: number
            required: true
          - name: cover
            label: "Forsidebillede"
            description: "Bredt billede til projektkortet. Skal med, så kortet ikke står tomt."
            type: image
            required: true
          - name: galleri
            label: "Galleri"
            type: image
            list: true
          - name: foer
            label: "Før-billede (valgfrit)"
            description: "Vises side om side med efter-billedet som en før/efter-sektion."
            type: image
          - name: efter
            label: "Efter-billede (valgfrit)"
            description: "Det færdige resultat — samme motiv som før-billedet, hvis muligt."
            type: image
          - name: resume
            label: "Kort resume (til kortet og meta)"
            type: text
          - name: body
            label: "Brødtekst"
            type: rich-text
      - name: ydelser_da
        label: "Ydelser"
        type: file
        path: content/da/ydelser/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: "Intern titel"
            type: string
            required: true
          - name: titel
            label: "Browser-titel (SEO)"
            type: string
          - name: beskrivelse
            label: "Meta-beskrivelse (SEO)"
            type: text
          - name: undertitel
            label: "Lille tekst over overskriften"
            type: string
          - name: resume
            label: "Kort resume"
            type: text
          - name: ydelser
            label: "Ydelser"
            type: object
            list: true
            fields:
              - name: navn
                label: "Navn"
                type: string
              - name: tekst
                label: "Beskrivelse"
                type: text
          - name: body
            label: "Brødtekst"
            type: rich-text
      - name: om_da
        label: "Om"
        type: file
        path: content/da/om/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: "Intern titel"
            type: string
            required: true
          - name: titel
            label: "Browser-titel (SEO)"
            type: string
          - name: beskrivelse
            label: "Meta-beskrivelse (SEO)"
            type: text
          - name: undertitel
            label: "Lille tekst over overskriften"
            type: string
          - name: billede
            label: "Billede til siden"
            type: image
          - name: body
            label: "Brødtekst"
            type: rich-text
      - name: kontakt_da
        label: "Kontakt"
        type: file
        path: content/da/kontakt/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: "Intern titel"
            type: string
            required: true
          - name: titel
            label: "Browser-titel (SEO)"
            type: string
          - name: beskrivelse
            label: "Meta-beskrivelse (SEO)"
            type: text
          - name: undertitel
            label: "Lille tekst over overskriften"
            type: string
          - name: body
            label: "Brødtekst"
            type: rich-text
