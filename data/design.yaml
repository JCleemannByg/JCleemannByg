# Design-tokens for siden.
# Redigeres via Pages CMS → "Design". Værdierne bliver til CSS-variabler
# (se assets/css/tokens.css), så farver, typografi og mål kan ændres uden at
# røre koden. Layout og struktur ligger stadig i layouts/ og er ikke redigerbar.

palette:
  paper: "#f6f1e7"      # baggrund
  paper2: "#ece4d5"     # sekundær baggrund
  card: "#fffdf8"       # kort/paneler
  ink: "#24231e"        # overskrifter og tekst
  inkSoft: "#54514a"    # brødtekst
  muted: "#7c7768"      # dæmpet tekst
  oak: "#a9703f"        # accent (knapper, links)
  oakDark: "#7d4c26"    # accent, hover
  line: "#dcd2c1"       # streger og kanter

typography:
  serif: '"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif'
  sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif'

layout:
  shell: "1160px"                                 # maks. indholdsbredde
  gutter: "clamp(1.25rem, 4.5vw, 3rem)"           # luft til siderne
  radius: "2px"                                   # hjørner på knapper
  shadow: "0 22px 44px -30px rgba(42, 32, 20, 0.5)"  # skygge på kort og fotos
