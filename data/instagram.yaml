# Instagram-indhold til forsiden.
#
# To måder at vise Instagram — vælg med `posts` og `items`:
#
#   posts  → en liste af LINKS til konkrete opslag. Hvert opslag vises som et
#            klikbart felt; først når besøgende klikker, indlæses Instagrams
#            officielle embed. Kræver ingen login, ingen token og sætter ingen
#            cookies før klikket.
#
#   items  → kuraterede lokale billeder (fallback når `posts` er tom).
#
# Hvert post:
#   url      link til opslaget, fx https://www.instagram.com/p/ABC123/
#   image    valgfrit lokalt forhåndsbillede i assets/ (anbefales — så ser
#            sektionen færdig ud, før nogen klikker)
#   caption  billedtekst på dansk og engelsk
#
# Eksempel:
#   posts:
#     - url: "https://www.instagram.com/p/ABC123/"
#       image: "images/instagram/01.jpg"
#       caption:
#         da: "Køkken i massiv eg"
#         en: "Kitchen in solid oak"
posts: []

profile_url: "https://www.instagram.com/jcleemann_byg/"
items:
  - image: "images/instagram/01.jpg"
    url: "https://www.instagram.com/jcleemann_byg/"
    caption:
      da: "Køkken i massiv eg"
      en: "Kitchen in solid oak"
  - image: "images/instagram/02.jpg"
    url: "https://www.instagram.com/jcleemann_byg/"
    caption:
      da: "Indbyggede skabe"
      en: "Built-in cupboards"
  - image: "images/instagram/03.jpg"
    url: "https://www.instagram.com/jcleemann_byg/"
    caption:
      da: "Renovering i Rudersdal"
      en: "Renovation in Rudersdal"
