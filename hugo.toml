# J Cleemann Byg — Hugo configuration
# Bilingual Danish (root) / English (/en/). See README.md for local commands.

baseURL = 'https://USERNAME.github.io/JCleemannByg/'
title = 'J Cleemann Byg'
enableRobotsTXT = true
timeZone = 'Europe/Copenhagen'
defaultContentLanguage = 'da'
defaultContentLanguageInSubdir = false

# A brochure site: no tag/taxonomy listing pages.
disableKinds = ['taxonomy', 'term', 'rss']

[params]
  # Optional live Instagram feed (developer setting, not exposed in Pages CMS).
  # Paste the widget embed code from SnapWidget/LightWidget here. Empty = the
  # posts from data/instagram_posts.json (or data/instagram.yaml) are shown.
  instagram_widget = ""

[imaging]
  [imaging.jpeg]
    quality = 82
  [imaging.webp]
    quality = 78

[markup.goldmark.renderer]
  unsafe = false

[languages]
  [languages.da]
    contentDir = 'content/da'
    label = 'Dansk'
    locale = 'da-DK'
    weight = 1
    title = 'J Cleemann Byg — tømrer og snedker i Nærum'
    [[languages.da.menu.main]]
      name = 'Projekter'
      pageRef = '/projekter'
      weight = 10
    [[languages.da.menu.main]]
      name = 'Ydelser'
      pageRef = '/ydelser'
      weight = 20
    [[languages.da.menu.main]]
      name = 'Om'
      pageRef = '/om'
      weight = 30
    [[languages.da.menu.main]]
      name = 'Kontakt'
      pageRef = '/kontakt'
      weight = 40

  [languages.en]
    contentDir = 'content/en'
    label = 'English'
    locale = 'en'
    weight = 2
    title = 'J Cleemann Byg — carpenter and joiner in Nærum, Denmark'
    [[languages.en.menu.main]]
      name = 'Projects'
      pageRef = '/projekter'
      weight = 10
    [[languages.en.menu.main]]
      name = 'Services'
      pageRef = '/ydelser'
      weight = 20
    [[languages.en.menu.main]]
      name = 'About'
      pageRef = '/om'
      weight = 30
    [[languages.en.menu.main]]
      name = 'Contact'
      pageRef = '/kontakt'
      weight = 40
