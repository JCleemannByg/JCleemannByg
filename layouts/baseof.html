<!doctype html>
<html lang="{{ site.Language.Locale | default site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}template-home{{ else }}template-{{ .Section | default "page" }}{{ end }}">
  <a class="skip-link" href="#main">{{ i18n "skip" }}</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
