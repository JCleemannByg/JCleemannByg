{{ define "main" }}
<div class="shell page-head">
  {{ with .Params.undertitel }}<p class="eyebrow">{{ . }}</p>{{ end }}
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Params.beskrivelse }}<p class="page-lead">{{ . }}</p>{{ end }}
</div>

<div class="shell page-body page-body--split">
  <div class="prose">{{ .Content }}</div>
  {{ with .Params.billede }}
  <figure class="photo-matted page-media">
    {{ partial "responsive-img.html" (dict "src" . "alt" (i18n "about_image_alt") "sizes" "(min-width: 900px) 42vw, 100vw" "widths" (slice 480 720 1080)) }}
  </figure>
  {{ end }}
</div>
{{ end }}
