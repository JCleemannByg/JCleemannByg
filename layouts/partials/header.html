{{- $site := hugo.Data.site -}}
<header class="site-header">
  <div class="shell site-header__inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand__name">{{ $site.brand | default site.Title }}</span>
      <span class="brand__sub">{{ i18n "brand_sub" }}</span>
    </a>

    <nav class="nav" aria-label="{{ i18n "nav_label" }}">
      <ul class="nav__list">
        {{- range site.Menus.main }}
        <li><a class="nav__link" href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>

    <div class="site-header__actions">
      <a class="button button--small site-header__phone" href="tel:{{ $site.phone_href }}" aria-label="{{ i18n "call" }} {{ $site.phone }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M6.6 3.8h3l1.4 3.6-1.8 1.2a12 12 0 0 0 5.2 5.2l1.2-1.8 3.6 1.4v3c0 1-.8 1.9-1.9 1.8C10.8 18.5 5.5 13.2 4.8 5.7c-.1-1 .8-1.9 1.8-1.9Z"/>
        </svg>
        <span class="btn-full">{{ i18n "call" }} {{ $site.phone }}</span>
        <span class="btn-short">{{ i18n "call" }}</span>
      </a>
      <a class="button button--small button--outline site-header__email" href="mailto:{{ $site.email }}" aria-label="{{ i18n "write" }}: {{ $site.email }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="1.5"/>
          <path d="m3.5 6.5 8.5 6 8.5-6"/>
        </svg>
        <span class="btn-full">{{ i18n "write" }}</span>
        <span class="btn-short">{{ i18n "write" }}</span>
      </a>
    </div>
  </div>
</header>
